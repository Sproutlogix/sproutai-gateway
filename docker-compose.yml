# Sprout AI Gateway: the gateway (API + web UI in one container) and a MySQL database.
#   cp .env.example .env     # or: sudo ./install.sh
#   docker compose up -d
# Then open http://localhost:8000 and sign in with ADMIN_EMAIL / ADMIN_PASSWORD from .env.

services:
  # --------------------------------------------------------
  # Database Service (MySQL)
  # --------------------------------------------------------
  db:
    # MySQL 8.4 LTS. Existing 8.0 data is upgraded automatically on first start (back it up first).
    image: mysql:8.4
    container_name: sproutai-mysql
    restart: unless-stopped
    # Pulls database credentials directly from your .env file
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}_root # Derived from MYSQL_PASSWORD
    # The database is only reachable from the gateway, on the internal Docker network.
    # To connect from the host, uncomment this (use a free port if MySQL also runs on the host):
    # ports:
    #   - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------
  # Sprout AI Gateway Service (API + web UI)
  # --------------------------------------------------------
  gateway:
    image: ghcr.io/sproutlogix/ai_gateway_core:${GATEWAY_VERSION:-latest}
    container_name: sproutai-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    # Loads provider keys, the first admin account, SMTP and other settings from .env
    env_file:
      - .env
    environment:
      # Use the bundled database on the internal Docker network
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy

# --------------------------------------------------------
# Persistent Storage Volumes
# --------------------------------------------------------
volumes:
  mysql_data:
    name: sproutai_mysql_data
