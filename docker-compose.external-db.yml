# Sprout AI Gateway without the bundled MySQL container: the gateway connects to the
# MySQL server set in .env (MYSQL_HOST, MYSQL_PORT, ...), such as Amazon RDS, Azure
# Database for MySQL, another server, or MySQL on this machine.
#
# install.sh selects this file by writing COMPOSE_FILE=docker-compose.external-db.yml
# to .env, so plain `docker compose up -d` uses it. Remove that line to go back to the
# bundled database in docker-compose.yml.
#
# MySQL on this machine:
#   macOS / Windows (Docker Desktop): set MYSQL_HOST=host.docker.internal
#   Linux: also use docker-compose.host-network.yml (install.sh sets this up), so the
#          gateway reaches MySQL at 127.0.0.1 without MySQL listening on other interfaces.

services:
  gateway:
    image: ghcr.io/sproutlogix/ai_gateway_core:${GATEWAY_VERSION:-latest}
    container_name: sproutai-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    # host.docker.internal is the machine Docker runs on (built into Docker Desktop; added here for Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Loads the database settings, provider keys, the first admin account and SMTP from .env
    env_file:
      - .env
